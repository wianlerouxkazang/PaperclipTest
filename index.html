<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My To-Do App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <div class="app-header">
        <h1>My To-Do App</h1>
        <button
          id="settings-toggle"
          type="button"
          class="settings-toggle"
          aria-expanded="false"
          aria-controls="settings-panel"
        >
          Settings
        </button>
      </div>

      <form id="task-form" class="task-form" autocomplete="off">
        <label for="task-input" class="sr-only">Task title</label>
        <input id="task-input" name="task" type="text" maxlength="120" placeholder="Add a new task" required />
        <button type="submit">Add</button>
      </form>

      <p id="form-error" class="error" role="alert" aria-live="polite"></p>

      <section id="settings-panel" class="settings-panel" hidden aria-live="polite">
        <h2 class="settings-title">Settings</h2>

        <div class="settings-row">
          <label for="default-filter">Default filter on load</label>
          <select id="default-filter" name="default-filter">
            <option value="all">All</option>
            <option value="active">Active</option>
            <option value="completed">Completed</option>
          </select>
        </div>

        <label class="settings-check">
          <input id="confirm-delete" type="checkbox" />
          Confirm before delete
        </label>

        <label class="settings-check">
          <input id="compact-density" type="checkbox" />
          Compact task spacing
        </label>

        <div class="settings-actions">
          <button id="settings-save" type="button">Save settings</button>
          <button id="settings-reset" type="button" class="secondary-btn">Reset defaults</button>
        </div>

        <p id="settings-message" class="settings-message" role="status" aria-live="polite"></p>
      </section>

      <div class="filters" role="group" aria-label="Task filters">
        <button type="button" data-filter="all" class="filter-btn active" aria-pressed="true">All</button>
        <button type="button" data-filter="active" class="filter-btn" aria-pressed="false">Active</button>
        <button type="button" data-filter="completed" class="filter-btn" aria-pressed="false">Completed</button>
      </div>

      <section aria-live="polite">
        <p id="empty-state" class="empty-state">No tasks yet. Add your first task.</p>
        <ul id="task-list" class="task-list"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
